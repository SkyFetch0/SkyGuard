# Publishes a release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# The dashboard's updater downloads skyguard-linux-<arch> from it, checks it
# against SHA256SUMS and, when the repository has a signing key, against
# SHA256SUMS.sig. A tag with a hyphen (v1.3.0-rc.1) becomes a pre-release,
# which only installs where update.channel is prerelease.
#
# It can also be started from the Actions tab (Run workflow) with a version:
# it then tags the commit it runs on and publishes that.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.2.0 (tagged v1.2.0 on the chosen branch)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v${INPUT_VERSION#v}"
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::$INPUT_VERSION is not a version like 1.2.0 or 1.3.0-rc.1"; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists"; exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build
        env:
          UPDATE_PUBKEY: ${{ vars.SKYGUARD_UPDATE_PUBKEY }}
        run: |
          version="${TAG#v}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.Version=${version} -X main.Commit=${GITHUB_SHA} -X main.BuildDate=${date} -X github.com/skyguard/skyguard/internal/update.BuildKey=${UPDATE_PUBKEY}" \
              -o "dist/skyguard-linux-${arch}" ./cmd/skyguard
          done
          (cd dist && sha256sum skyguard-linux-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Sign
        env:
          SKYGUARD_SIGNING_KEY: ${{ secrets.SKYGUARD_SIGNING_KEY }}
        run: |
          if [ -z "$SKYGUARD_SIGNING_KEY" ]; then
            echo "::warning::SKYGUARD_SIGNING_KEY is not set: the release is not signed (see README, Updates)"
            exit 0
          fi
          go run ./cmd/skyguard -update-sign dist/SHA256SUMS > dist/SHA256SUMS.sig

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # a pushed tag must exist; a started run tags the commit it built
          verify="--verify-tag"
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && verify="--target $GITHUB_SHA"
          gh release create "$TAG" dist/* --title "SkyGuard ${TAG#v}" --generate-notes $verify $pre
