# Copy the example config first:
#   cp configs/skyguard.example.yaml configs/skyguard.yaml   # then edit it
# (If the file does not exist Docker creates a *directory* with that name and
# SkyGuard fails with "is a directory".)
services:
  skyguard:
    build: .
    image: skyguard:latest
    container_name: skyguard
    restart: unless-stopped
    # Host networking: honeypots see real client IPs and iptables bans apply
    # to the host's INPUT chain.
    network_mode: host
    # Lets the Ports screen see what runs behind the extra IPs this host
    # routes to Incus instances or containers (their network namespaces and
    # listening ports). Without it the addresses are still found and covered.
    # The Software screen also reads running containers and Incus instances
    # through it; without it only Docker containers are read, through the
    # Docker API.
    # pid: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/data
      - ./configs/skyguard.yaml:/etc/skyguard/skyguard.yaml:ro
      # Container management (containers.docker / containers.incus in the
      # config): uncomment the engines you enable. Either socket is root on
      # the host. Incus's directory is mounted because its socket is
      # recreated whenever Incus restarts.
      # - /var/run/docker.sock:/var/run/docker.sock
      # - /var/lib/incus:/var/lib/incus:ro
      # Closing a container's port from the dashboard also edits that
      # project's compose file, so "docker compose up" keeps the change; for
      # that SkyGuard must see the file at the same path as the host does.
      # Mount the folder your projects live in, e.g.:
      # - /opt:/opt
      # The Software screen reads the server's own installed packages from
      # here. Read-only; nothing in it is ever run.
      # - /:/host:ro
    environment:
      - SKYGUARD_CONFIG=/etc/skyguard/skyguard.yaml
      - TZ=Europe/Istanbul   # only affects log display; data is stored in UTC
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "/usr/local/bin/skyguard", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
