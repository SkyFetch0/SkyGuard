# SkyGuard Configuration
# https://github.com/skyguard/skyguard
#
# All services support an optional "enabled: false" flag to disable without removing.
# Restart the container after any config change: docker compose restart
# Validate before restarting:  skyguard -check-config -config <file>
#
# Durations accept Go syntax plus days: "90s", "30m", "24h", "7d", "1d12h".

general:
  log_level: "info"       # debug | info | warn | error
  data_dir: "/data"       # SQLite DB, GeoIP DB and SSH honeypot host keys

# ── Stealth Services ──────────────────────────────────────────────────────────
# Real services hidden behind a random port.
# Scanners get no banner (nmap: "tcpwrapped"). Only clients sending the correct
# protocol signature within the timeout are forwarded to the real service.
stealth_services:
  - name: "ssh"
    enabled: true                        # set false to disable without deleting
    listen_port: 9911                    # public-facing port clients connect to
    real_target: "127.0.0.1:22"         # where the real sshd listens
    protocol_signature: "SSH-2.0-"      # first bytes a real SSH client sends
    timeout: "5s"                        # drop connection if no matching data arrives
    allowed_countries: []               # e.g. ["TR","US"]; needs GeoIP (ignored with a warning otherwise)

# ── Honeypot Services ─────────────────────────────────────────────────────────
# Fake services that log attacker activity and contribute to threat scoring.
# Toggle honeypots with "enabled: true/false" + restart, or switch them at
# runtime on the dashboard's Honeypots screen (kept until you edit that entry here).
#
# NOTE: a honeypot cannot bind a port another process already uses. The real
# sshd normally holds port 22, so fake-ssh is disabled here; run
# scripts/enable-ssh-honeypot.sh to move sshd away and enable it safely.
honeypot_services:
  - name: "fake-ssh"
    enabled: false
    port: 22
    type: "ssh"            # real SSH-2 handshake; captures password attempts
    banner: "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6"
    max_auth_attempts: 3    # reject N password attempts, then disconnect

  - name: "fake-ftp"
    enabled: true
    port: 21
    type: "ftp"
    banner: "ProFTPD 1.3.5e Server (Debian) ready."

  - name: "fake-mysql"
    enabled: true
    port: 3306
    type: "mysql"
    banner: "5.7.42-0ubuntu0.18.04.1"   # MySQL version string shown in handshake

  - name: "fake-http"
    enabled: true
    port: 80
    type: "http"            # captures WordPress/phpMyAdmin/Basic-Auth logins
    server_header: "Apache/2.4.41 (Ubuntu)"

  - name: "fake-http-alt"
    enabled: false          # disabled by default — enable if you don't use 8080
    port: 8080
    type: "http"
    server_header: "nginx/1.18.0"

# ── Passthrough Services ──────────────────────────────────────────────────────
# Analyse and log traffic, then forward to the real backend unchanged.
passthrough_services:
  - name: "web"
    enabled: false          # enable only if 443 is free and a backend exists
    listen_port: 443
    real_target: "127.0.0.1:8443"   # your actual HTTPS backend

# ── Analysis ──────────────────────────────────────────────────────────────────
analysis:
  geoip:
    enabled: false                        # requires GeoLite2-City.mmdb in data_dir
    db_path: "/data/GeoLite2-City.mmdb"

  rate_limit:
    max_per_minute: 20
    max_per_hour: 200

  port_scan:
    window: "60s"     # time window for counting distinct ports
    threshold: 5      # distinct ports within window → flagged as port scan

  auto_ban:
    enabled: true
    score_threshold: 50     # ban IP when its threat score reaches this value
    ban_duration: "24h"     # e.g. "1h", "24h", "7d"; "0s" = permanent
    # "iptables" (recommended, also inside Docker) | "ufw" (bare-metal only,
    # falls back to iptables when ufw is inactive or in a container) | "none"
    method: "iptables"
    iptables_backend: "auto" # auto | legacy | nft — auto matches the host
    # Bans also stop traffic this host passes on: extra IPs routed to Incus
    # instances or VMs, hand-made DNAT, a network behind it. Turn off only if
    # this host routes for others who must reach banned addresses.
    cover_forwarded: true

    # Points added to an IP's threat score on each event
    scoring:
      honeypot_connection: 10
      failed_credential: 15
      port_scan_detected: 25
      blacklisted_country: 5
      rate_limit_exceeded: 20

# ── Whitelist ─────────────────────────────────────────────────────────────────
# These IPs/CIDRs are NEVER banned, scored or rate-limited and bypass all
# checks (loopback is always included). Add your home/office IP before
# enabling auto-ban.
whitelist:
  ips:
    - "127.0.0.1"
    - "::1"
    # - "YOUR_HOME_IP"
    # - "192.168.0.0/16"   # CIDR ranges are supported
  countries: []  # e.g. ["TR"] to whitelist an entire country

# ── Blacklist ─────────────────────────────────────────────────────────────────
# Connections from these are dropped immediately. Use ISO 3166-1 alpha-2 codes.
blacklist:
  countries: []
    # - "CN"
    # - "RU"
    # - "KP"
  ips: []
    # - "1.2.3.4"
    # - "198.51.100.0/24"

# ── Dashboard ─────────────────────────────────────────────────────────────────
# Always bind to 127.0.0.1 and access via SSH tunnel:
#   ssh -L 9090:127.0.0.1:9090 user@your-server
# SkyGuard refuses to start a non-loopback dashboard without a strong password.
# GET /healthz is unauthenticated (used by the Docker health check).
dashboard:
  enabled: true
  listen: "127.0.0.1:9090"
  auth:
    username: "admin"
    password: "CHANGE_ME_NOW"   # use a strong password

# ── Containers ───────────────────────────────────────────────────────────────
# The dashboard's Containers screen: list the host's Docker containers and
# Incus instances, start/stop them, change their published ports, restart
# policy and limits, and patch them into each other's networks.
# Access to either socket is equivalent to root on the host, so this needs
# dashboard.auth, and it is off until enabled here. With docker compose, also
# mount the socket (see docker-compose.yml).
containers:
  read_only: false        # true: list only, no changes
  docker:
    enabled: false
    socket: "/var/run/docker.sock"
  incus:
    enabled: false
    socket: "/var/lib/incus/unix.socket"
    project: ""           # empty = the default project

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  database: "sqlite"
  db_path: "/data/skyguard.db"
  retention_days: 90      # delete records older than N days
  log_first_bytes: 512    # max bytes of attacker-supplied data stored per event

# ─── Updates ──────────────────────────────────────────────────────────────────
# The dashboard (Settings → Version and updates) shows new releases and
# installs one when you click: checked, tested with this config, database and
# config backed up, undone by itself if it keeps failing to start.
update:
  check: true                  # look for new releases every 6 hours
  repo: "SkyFetch0/SkyGuard"   # a fork can point at its own releases
  channel: "stable"            # stable | prerelease
  # public_key: ""             # base64 ed25519 key releases must be signed with
